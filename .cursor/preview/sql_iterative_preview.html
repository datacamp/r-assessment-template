<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQL Iterative Exercise Preview</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/sql.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #e0e0e0; line-height: 1.6; }
    .container { display: flex; min-height: 100vh; }
    .left-panel { width: 420px; background: #16213e; border-right: 1px solid #2a2a4a; padding: 24px; overflow-y: auto; }
    .exercise-label { display: flex; align-items: center; gap: 8px; color: #888; font-size: 14px; margin-bottom: 16px; }
    .exercise-label svg { width: 16px; height: 16px; }
    .exercise-title { font-size: 22px; font-weight: 600; margin-bottom: 16px; color: #fff; }
    .context { font-size: 15px; color: #b0b0b0; margin-bottom: 24px; }
    .context p { margin-bottom: 12px; }
    .context code { background: #2a2a4a; padding: 2px 6px; border-radius: 4px; font-family: 'Monaco', 'Menlo', monospace; font-size: 13px; color: #7dd3fc; }
    .steps-header { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
    .steps-label { font-size: 14px; color: #888; }
    .step-indicator { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .step-indicator-text { font-size: 14px; color: #888; }
    .xp-badge { background: rgba(34, 197, 94, 0.2); color: #22c55e; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
    .step-buttons { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
    .step-button { display: flex; align-items: flex-start; gap: 12px; padding: 16px; background: #1a1a2e; border: 2px solid #2a2a4a; border-radius: 8px; cursor: pointer; transition: all 0.2s; text-align: left; }
    .step-button:hover { border-color: #3a3a5a; }
    .step-button.active { border-color: #3b82f6; background: rgba(59, 130, 246, 0.1); }
    .step-button.completed { border-color: #22c55e; background: rgba(34, 197, 94, 0.05); }
    .step-bullet { display: flex; align-items: center; justify-content: center; width: 12px; height: 12px; background: #4a4a6a; border-radius: 50%; flex-shrink: 0; margin-top: 6px; }
    .step-button.active .step-bullet { background: #3b82f6; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2); }
    .step-button.completed .step-bullet { background: #22c55e; }
    .step-content { flex: 1; }
    .step-instruction { font-size: 14px; color: #d0d0d0; line-height: 1.5; }
    .step-button.active .step-instruction { color: #ffffff; }
    .step-instruction code { background: #2a2a4a; padding: 2px 6px; border-radius: 4px; font-family: 'Monaco', 'Menlo', monospace; font-size: 12px; color: #7dd3fc; }
    .step-xp { font-size: 12px; color: #22c55e; margin-top: 4px; }
    .take-hint-btn { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 6px 12px; background: transparent; border: 1px solid #2a2a4a; border-radius: 4px; font-size: 12px; color: #888; cursor: pointer; }
    .take-hint-btn:hover { border-color: #3a3a5a; color: #b0b0b0; }
    .hint-section { background: #1a1a2e; border-radius: 8px; padding: 16px; margin-top: 16px; }
    .hint-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: #fff; }
    .hint-list { list-style: disc; padding-left: 20px; font-size: 14px; color: #b0b0b0; }
    .hint-list li { margin-bottom: 8px; }
    .hint-list code { background: #2a2a4a; padding: 2px 6px; border-radius: 4px; font-family: 'Monaco', 'Menlo', monospace; font-size: 12px; color: #7dd3fc; }
    .right-panel { flex: 1; display: flex; flex-direction: column; background: #0f0f23; }
    .editor-header { display: flex; align-items: center; background: #16213e; border-bottom: 1px solid #2a2a4a; padding: 0 16px; }
    .tab { padding: 12px 16px; font-size: 14px; color: #888; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; }
    .tab:hover { color: #fff; }
    .tab.active { color: #fff; border-bottom-color: #3b82f6; }
    .editor-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .theme-toggle { display: flex; align-items: center; gap: 6px; color: #888; font-size: 13px; padding: 6px 12px; background: #2a2a4a; border: none; border-radius: 4px; cursor: pointer; }
    .code-editor { flex: 0.7; padding: 16px; overflow: auto; min-height: 120px; }
    .code-editor pre { margin: 0; background: transparent !important; padding: 0 !important; }
    .code-editor code { font-family: 'Monaco', 'Menlo', 'Consolas', monospace; font-size: 14px; line-height: 1.6; }
    .line-numbers { display: inline-block; width: 30px; color: #555; text-align: right; padding-right: 16px; user-select: none; }
    .editor-footer { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #16213e; border-top: 1px solid #2a2a4a; }
    .btn { padding: 10px 20px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; border: none; }
    .btn-secondary { background: #2a2a4a; color: #fff; }
    .btn-secondary:hover { background: #3a3a5a; }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-primary:hover { background: #2563eb; }
    .btn-icon { width: 40px; height: 40px; padding: 0; display: flex; align-items: center; justify-content: center; background: #2a2a4a; border: none; border-radius: 6px; cursor: pointer; color: #888; }
    .footer-spacer { flex: 1; }
    .shell-container { height: 200px; background: #0f0f23; border-top: 1px solid #2a2a4a; }
    .shell-header { display: flex; background: #16213e; border-bottom: 1px solid #2a2a4a; }
    .shell-tab { padding: 8px 16px; font-size: 13px; color: #888; cursor: pointer; border-bottom: 2px solid transparent; }
    .shell-tab.active { color: #fff; border-bottom-color: #3b82f6; }
    .shell-content { padding: 16px; font-family: 'Monaco', 'Menlo', monospace; font-size: 14px; color: #888; }
    .shell-prompt { color: #f59e0b; }
    .success-message { background: rgba(34, 197, 94, 0.15); border: 1px solid #22c55e; border-radius: 6px; padding: 12px 16px; margin: 12px 16px; display: flex; align-items: flex-start; gap: 10px; }
    .success-message.hidden { display: none; }
    .success-icon { color: #22c55e; flex-shrink: 0; margin-top: 2px; }
    .success-text { color: #22c55e; font-size: 14px; line-height: 1.5; }
    .preview-banner { background: #fef3c7; border-bottom: 1px solid #f59e0b; padding: 8px 16px; text-align: center; font-size: 13px; color: #92400e; }
    .preview-banner strong { font-weight: 600; }
    .independent-notice { background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 4px; padding: 8px 12px; margin-bottom: 16px; font-size: 12px; color: #f59e0b; display: flex; align-items: center; gap: 8px; }
    .independent-notice svg { width: 16px; height: 16px; flex-shrink: 0; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="preview-banner">
    <strong>Preview Mode</strong> — SQL Iterative Exercise (BulletExercise) — Each step is independent
  </div>

  <div class="container">
    <div class="left-panel">
      <div class="exercise-label">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4" />
        </svg>
        SQL Iterative Exercise
      </div>

      <h1 class="exercise-title" id="title">Loading...</h1>
      <div class="context" id="context">Loading...</div>

      <div class="independent-notice">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        Each step starts fresh — code doesn't carry over between steps
      </div>

      <div class="steps-header">
        <span class="steps-label">Instructions</span>
        <div class="step-indicator">
          <span class="step-indicator-text" id="step-indicator">1/2</span>
          <span class="xp-badge" id="xp-badge">50 XP</span>
        </div>
      </div>

      <div class="step-buttons" id="step-buttons"></div>

      <div class="hint-section" id="hint-section">
        <h3 class="hint-title">Hint</h3>
        <ul class="hint-list" id="hints"><li>Loading...</li></ul>
      </div>
    </div>

    <div class="right-panel">
      <div class="editor-header">
        <div class="tab active" id="tab-script">script.sql</div>
        <div class="tab" id="tab-solution">solution.sql</div>
        <div class="editor-actions">
          <button class="theme-toggle">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="16" height="16">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
            Light Mode
          </button>
        </div>
      </div>

      <div class="code-editor" id="code-editor">
        <pre><code class="language-sql" id="code-content">Loading...</code></pre>
      </div>

      <div class="editor-footer">
        <button class="btn-icon" title="Reset">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="20" height="20">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
        </button>
        <div class="footer-spacer"></div>
        <button class="btn btn-secondary">Run Code</button>
        <button class="btn btn-primary" id="submit-btn">Submit Answer</button>
      </div>

      <div class="shell-container">
        <div class="shell-header">
          <div class="shell-tab active">SQL Console</div>
        </div>
        <div class="shell-content">
          <span class="shell-prompt">postgresql&gt;</span> <span id="shell-cursor">|</span>
        </div>
        <div class="success-message hidden" id="success-message">
          <svg class="success-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="20" height="20">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span class="success-text" id="success-text"></span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const EXERCISE_DATA = __EXERCISE_DATA__;
    let currentStep = 0;
    let currentTab = 'script';

    function formatCode(code) {
      if (!code) return '';
      const lines = code.split('\n');
      return lines.map((line, i) => {
        const lineNum = String(i + 1).padStart(2, ' ');
        return `<span class="line-numbers">${lineNum}</span>${escapeHtml(line)}`;
      }).join('\n');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function parseMarkdownInline(text) {
      text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      text = text.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      text = text.replace(/_([^_]+)_/g, '<em>$1</em>');
      text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
      return text;
    }

    function selectStep(stepIndex) {
      currentStep = stepIndex;
      renderStepButtons();
      renderCurrentStep();
    }

    function showTab(tab) {
      currentTab = tab;
      document.getElementById('tab-script').classList.toggle('active', tab === 'script');
      document.getElementById('tab-solution').classList.toggle('active', tab === 'solution');
      document.getElementById('submit-btn').textContent = tab === 'script' ? 'Submit Answer' : 'Run Solution';
      renderCode();
    }

    function renderCode() {
      const step = EXERCISE_DATA.steps[currentStep];
      const code = currentTab === 'script' ? step.sample_code : step.solution;
      const codeElement = document.getElementById('code-content');
      codeElement.innerHTML = formatCode(code);
      hljs.highlightElement(codeElement);
    }

    function renderStepButtons() {
      const container = document.getElementById('step-buttons');
      container.innerHTML = '';
      EXERCISE_DATA.steps.forEach((step, index) => {
        const isActive = index === currentStep;
        const isCompleted = index < currentStep;
        const instruction = step.instructions.split('\n').map(line => line.replace(/^[-*]\s*/, '').trim()).filter(line => line).join(' ');
        const stepBtn = document.createElement('div');
        let className = 'step-button';
        if (isActive) className += ' active';
        if (isCompleted) className += ' completed';
        stepBtn.className = className;
        stepBtn.innerHTML = `
          <div class="step-bullet"></div>
          <div class="step-content">
            <div class="step-instruction">${parseMarkdownInline(instruction)}</div>
            <div class="step-xp">${step.xp} XP</div>
            ${isActive ? '<button class="take-hint-btn">💡 Take Hint (-15 XP)</button>' : ''}
          </div>`;
        stepBtn.addEventListener('click', function(e) {
          if (!e.target.classList.contains('take-hint-btn')) selectStep(index);
        });
        container.appendChild(stepBtn);
      });
    }

    function renderCurrentStep() {
      const step = EXERCISE_DATA.steps[currentStep];
      document.getElementById('step-indicator').textContent = `${currentStep + 1}/${EXERCISE_DATA.steps.length}`;
      document.getElementById('xp-badge').textContent = `${step.xp} XP`;
      const hints = step.hint.split('\n').map(line => line.replace(/^[-*]\s*/, '').trim()).filter(line => line);
      document.getElementById('hints').innerHTML = hints.length > 0 ? hints.map(item => `<li>${parseMarkdownInline(item)}</li>`).join('') : '<li>No hints available</li>';
      renderCode();
    }

    function renderExercise() {
      if (!EXERCISE_DATA) { document.getElementById('title').textContent = 'Error loading exercise'; return; }
      document.getElementById('title').textContent = EXERCISE_DATA.title || 'Exercise';
      const contextHtml = EXERCISE_DATA.context.split('\n\n').filter(p => p.trim()).map(p => `<p>${parseMarkdownInline(p.trim())}</p>`).join('');
      document.getElementById('context').innerHTML = contextHtml;
      renderStepButtons();
      renderCurrentStep();
      document.getElementById('tab-script').addEventListener('click', () => showTab('script'));
      document.getElementById('tab-solution').addEventListener('click', () => showTab('solution'));
      if (EXERCISE_DATA.success_msg) {
        document.getElementById('success-text').textContent = EXERCISE_DATA.success_msg;
        document.getElementById('success-message').classList.remove('hidden');
      }
    }

    document.addEventListener('DOMContentLoaded', renderExercise);
  </script>
</body>
</html>
