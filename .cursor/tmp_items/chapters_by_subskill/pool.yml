title: Data Analysis in Excel
programming_language: excel
type: skill-assessment
subskills:
  - name: "excel-fundamentals"
    full: "Excel Fundamentals"
    courses:
      - "Introduction to Excel"
    description: "Navigate Excel interface, work with workbooks/worksheets/cells, create tables, use structured references, filter/sort data, format cells, create basic formulas, and use aggregate functions (SUM, AVERAGE, COUNT, MIN, MAX)."

  - name: "data-preparation"
    full: "Data Preparation"
    courses:
      - "Data Preparation in Excel"
    description: "Import data from CSV/text files, clean data (Remove Duplicates, Flash Fill, Fill Series), apply text functions (LEN, CONCAT, TEXTJOIN), date functions (TODAY, WEEKDAY, WORKDAY), logical functions (IF, AND, OR, NOT), and lookup functions (VLOOKUP, HLOOKUP)."

  - name: "data-analysis"
    full: "Data Analysis"
    courses:
      - "Data Analysis in Excel"
    description: "Create and configure PivotTables, use calculated fields/grouping/slicers, apply intermediate logical functions (IFS, SWITCH), conditional aggregations (COUNTIF, SUMIF, AVERAGEIF, COUNTIFS, SUMIFS), perform what-if analysis (Goal Seek, Scenario Manager, Data Tables), and create forecasts (moving averages, trendlines, FORECAST.ETS)."

  - name: "data-visualization"
    full: "Data Visualization"
    courses:
      - "Data Visualization in Excel"
    description: "Create basic charts (bar, column, line, pie), build advanced charts (combo, bullet, waterfall, scatter, bubble), apply visualization best practices, create PivotCharts, and build interactive dashboards with slicers/timelines."
